<style>
/* Variables de Couleurs pour une Maintenance Facilitée */

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

/* Style Général pour l'En-tête */
header {
  position: fixed;
  top: 0;
  width: 100%;
  z-index: 1000;
  background: #fff;
  box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
}

/* Top Bar */
.top-bar {
  background: #114D5A;
  color: #fff;
  padding: 10px 0;
}

.top-bar .container {
  display: flex;
  justify-content: flex-end;
  width: 90%;
  margin: 0 auto;
}

.language-selector button {
  background: none;
  border: none;
  color: #fff;
  cursor: pointer;
  font-size: 1em;
  padding: 5px 10px;
  transition: color 0.3s;
}

.language-selector button:hover {
  color: #FAC83B;
}

/* Navigation */
nav {
  background: #fff;
  padding: 10px 0;
}

nav .container {
  display: flex;
  justify-content: space-between;
  align-items: center;
  width: 90%;
  margin: 0 auto;
}

.logo {
  width: 120px;
}

.logo img {
  width: 100%;
  height: auto;
  object-fit: contain;
}

/* Burger Menu */
.burger {
  display: none;
  background: none;
  border: none;
  cursor: pointer;
  font-size: 1.5em;
  color: #333;
  transition: color 0.3s;
}

.burger.active {
  color: #FAC83B;
}

/* Navigation Links */
.nav-links {
  list-style: none;
  display: flex;
  gap: 20px;
  align-items: center;
}

.nav-links li {
  position: relative;
}

.nav-links a {
  text-decoration: none;
  color: #333;
  font-size: 1em;
  font-weight: bold;
  transition: color 0.3s;
}

.nav-links a.actived,
.nav-links a:hover {
  color: #FAC83B;
}

/* Dropdown */
.dropdown {
  position: relative;
}

.dropdown-menu {
  position: absolute;
  top: 40px;
  left: 0;
  background-color: #fff;
  box-shadow: 0 8px 16px rgba(0, 0, 0, 0.1);
  list-style: none;
  padding: 10px 0;
  margin: 0;
  min-width: 180px;
  border-radius: 4px;
  display: none;
  transition: opacity 0.3s;
  opacity: 0;
  visibility: hidden;
  z-index: 1000;
}

.dropdown.open .dropdown-menu {
  display: block;
  opacity: 1;
  visibility: visible;
}

.dropdown-menu li a {
  display: block;
  padding: 10px 20px;
  color: #333;
  font-weight: 400;
  transition: background-color 0.3s;
}

.dropdown-menu li a:hover {
  background-color: #f4f4f4;
}

/* Actions (Desktop) */
.actions {
  display: flex;
  gap: 10px;
}

.btn,
.btn2 {
  padding: 10px 20px;
  text-decoration: none;
  border-radius: 8px;
  font-weight: bold;
  transition: background-color 0.3s, color 0.3s;
}

.btn {
  background: #114D5A;
  color: #ffcc00;
}

.btn:hover {
  background: #0f3b46;
  color: #ffcc00;
}

.btn2 {
  background: #ffcc00;
  color: #000;
}

.btn2:hover {
  background: #e6b800;
}

/* Mobile Menu */
.mobile-actions {
  display: none;
  flex-direction: column;
  gap: 10px;
  margin-top: 20px;
  padding: 15px;
}

.close-btn {
  display: none;
  justify-content: flex-end;
  padding: 0 20px;
  margin-bottom: 20px;
}

.close-btn button {
  background: none;
  border: none;
  font-size: 1.5em;
  cursor: pointer;
  color: #333;
  display: flex;
  justify-content: center;
  align-items: center;
  transition: color 0.3s;
}

.close-btn button:hover {
  color: #FAC83B;
}
/* Responsive Styles */
@media (max-width: 1024px) {
  a.btn2 {
    text-align: center;
}
  .burger {
    display: block;
  }

  /* Masquer les actions desktop */
  .actions {
    display: none;
  }

  /* Modifier l'affichage des liens de navigation */
  .nav-links {
    position: fixed;
    top: 60px;
    left: -100%;
    flex-direction: column;
    background-color: #fff;
    width: 80%;
    height: 100%;
    padding-top: 20px;
    transition: left 0.3s ease-in-out;
    box-shadow: 2px 0 5px rgba(0, 0, 0, 0.1);
    overflow-y: auto;
  }

  .nav-links.active {
    left: 0;
  }

  .nav-links li {
    width: 100%;
    text-align: left;
  }

  .nav-links li a {
    display: block;
    padding: 15px 20px;
    font-size: 1em;
  }

  /* Dropdown pour mobile */
  .dropdown-menu {
    position: static;
    box-shadow: none;
    padding: 0;
    margin: 0;
    min-width: 0;
    display: none;
    border: none !important;
  }

  .dropdown.open .dropdown-menu {
    display: block;
  }

  .dropdown-menu li a {
    padding: 10px 20px;
  }

  /* Afficher les actions mobile */
  .mobile-actions {
    display: flex;
  }

  /* Afficher le bouton fermer */
  .close-btn {
    display: flex;
  }
}

/* Responsive Styles */
@media (max-width: 768px) {
  /* Afficher le menu burger */
  a.btn2 {
    text-align: center;
}

  .burger {
    display: block;
  }

  /* Masquer les actions desktop */
  .actions {
    display: none;
  }

  /* Modifier l'affichage des liens de navigation */
  .nav-links {
    position: fixed;
    top: 60px;
    left: -100%;
    flex-direction: column;
    background-color: #fff;
    width: 80%;
    height: 100%;
    padding-top: 20px;
    transition: left 0.3s ease-in-out;
    box-shadow: 2px 0 5px rgba(0, 0, 0, 0.1);
    overflow-y: auto;
  }

  .nav-links.active {
    left: 0;
  }

  .nav-links li {
    width: 100%;
    text-align: left;
  }

  .nav-links li a {
    display: block;
    padding: 15px 20px;
    font-size: 1em;
  }

  /* Dropdown pour mobile */
  .dropdown-menu {
    position: static;
    box-shadow: none;
    padding: 0;
    margin: 0;
    min-width: 0;
    display: none;
    border: none !important;
  }

  .dropdown.open .dropdown-menu {
    display: block;
  }

  .dropdown-menu li a {
    padding: 10px 20px;
  }

  /* Afficher les actions mobile */
  .mobile-actions {
    display: flex;
  }

  /* Afficher le bouton fermer */
  .close-btn {
    display: flex;
  }
}

@media (max-width: 480px) {
  a.btn2 {
    text-align: center;
}
  .logo {
    width: 80px;
  }

  .nav-links li a {
    font-size: 0.9em;
  }

  .btn,
  .btn2 {
    padding: 8px 16px;
    font-size: 0.9em;
  }

  .dropdown-menu {
    border: none !important;
  }
}

/* Améliorations Esthétiques Supplémentaires */

/* Transition Douce pour le Menu */
.nav-links,
.dropdown-menu {
  transition: all 0.3s ease-in-out;
}

/* Animation pour le Burger Menu */
.burger i {
  transition: transform 0.3s, color 0.3s;
}

.burger.active i {
  transform: rotate(90deg);
}

/* Effet de Survol sur les Liens de Navigation */
.nav-links a:hover,
.nav-links a.actived {
  color: #FAC83B;
}

/* Style pour les Icons dans les Dropdowns */
.nav-links .dropdown a i {
  margin-left: 5px;
  transition: transform 0.3s;
}

.nav-links .dropdown.open a i {
  transform: rotate(180deg);
}


</style>
<header>
  <!-- Top Bar -->
  <div class="top-bar">
    <div class="container">
      <div class="language-selector">
        <button aria-label="Changer la langue">Français</button>
      </div>
    </div>
  </div>

  <!-- Navigation -->
  <nav>
    <div class="container">
      <!-- Logo -->
      <div class="logo">
        <a routerLink="/">
          <img src="../../assets/img/accueil/logoMSL.png" alt="Logo MSL" />
        </a>
      </div>

      <!-- Menu Burger avec icône fa-bars/fa-times -->
      <button class="burger" (click)="toggleMenu()" [ngClass]="{'active': isMenuOpen}" aria-label="Ouvrir le menu">
        <i class="fas fa-bars"></i>
      </button>

      <!-- Navigation Links -->
      <ul class="nav-links" [ngClass]="{'active': isMenuOpen}">
        <!-- Bouton Fermer (Mobile) -->
        <li class="close-btn">
          <button (click)="toggleMenu()" aria-label="Fermer le menu">
            <i class="fas fa-times"></i>
          </button>
        </li>

        <li><a routerLink="/accueil" routerLinkActive="actived">Accueil</a></li>
        <li class="dropdown" (click)="toggleDropdown()" [ngClass]="{'open': isDropdownOpen}">
          <a aria-haspopup="true" [attr.aria-expanded]="isDropdownOpen">
            Vos besoins <i class="fas fa-chevron-down"></i>
          </a>
          <ul class="dropdown-menu">
            <li><a routerLink="/serviceOdoo" routerLinkActive="actived">Application Odoo</a></li>
            <li><a routerLink="/service2" routerLinkActive="actived">Finances</a></li>
            <li><a routerLink="/service3" routerLinkActive="actived">Ventes</a></li>
            <li><a routerLink="#" routerLinkActive="actived">Fabrications</a></li>
            <li><a routerLink="#" routerLinkActive="actived">Site Internet</a></li>
            <li><a routerLink="#" routerLinkActive="actived">Services</a></li>
          </ul>
        </li>
        <li><a routerLink="/package-metier" routerLinkActive="actived">Package Métier</a></li>
        <li><a routerLink="/about" routerLinkActive="actived">À propos</a></li>
        <li class="dropdown" (click)="toggleTarifsDropdown()" [ngClass]="{'open': isTarifsDropdownOpen}">
          <a aria-haspopup="true" [attr.aria-expanded]="isTarifsDropdownOpen">
            Tarifs <i class="fas fa-chevron-down"></i>
          </a>
          <ul class="dropdown-menu">
            <li><a routerLink="/pricing" routerLinkActive="actived">Tarif Odoo</a></li>
            <li><a routerLink="/tarif" routerLinkActive="actived">Tarif Code</a></li>
          </ul>
        </li>        
        <!-- Actions Mobile -->
        <li class="mobile-actions">
          <a routerLink="/besoin" class="btn" style="text-align: center; color: #FAC83B !important">Soumettre un besoin</a>
          <a routerLink="/contact" class="btn2">Contactez-nous</a>
        </li>
      </ul>

      <!-- Actions (Desktop) -->
      <div class="actions">
        <a routerLink="/besoin" class="btn " >Soumettre un besoin</a>
        <a routerLink="/contact" class="btn2" style="text-align: center;">Contactez-nous</a>
      </div>
    </div>
  </nav>
</header>
