<div class="awwwards-slider">
  <!-- Slides Wrapper -->
  <div class="slides-wrapper">
    <div
      class="slide-item"
      *ngFor="let slide of slides; let i = index"
      [class.active]="currentSlide === i"
      [class.prev]="previousSlide === i"
    >
      <!-- Image Background with Parallax/Zoom effect -->
      <div class="slide-bg">
        <img
          [appResponsiveImage]="slide.imageConfig"
          [fallbackSrc]="slide.fallbackSrc"
          class="bg-image"
          alt="Slide Background"
        />
        <div class="overlay"></div>
      </div>

      <!-- Content -->
      <div class="slide-content container">
        <div class="text-wrapper">
          <!-- Overflow hidden for reveal effect -->
          <div class="reveal-box">
            <h2 class="title">
              {{ slide.title }} <span class="highlight">{{ slide.highlight }}</span>
            </h2>
          </div>
          
          <div class="reveal-box">
            <p class="description">{{ slide.description }}</p>
          </div>

          <div class="buttons-wrapper" *ngIf="slide.buttons.length > 0">
            <button
              *ngFor="let button of slide.buttons"
              class="magnetic-btn"
              [style.--btn-color]="button.color"
              [style.--btn-text]="button.textColor"
              (click)="navigateTo(button.link)"
            >
              <span class="btn-text">{{ button.text }}</span>
              <span class="btn-fill"></span>
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Modern Navigation -->
  <div class="slider-controls">
    <div class="progress-bar">
      <div class="progress-fill" [style.width.%]="((currentSlide + 1) / slides.length) * 100"></div>
    </div>
    
    <div class="pagination-numbers">
      <span class="current">0{{ currentSlide + 1 }}</span>
      <span class="separator">/</span>
      <span class="total">0{{ slides.length }}</span>
    </div>

    <div class="nav-arrows">
      <button (click)="prev()" class="nav-btn prev" aria-label="Previous Slide">←</button>
      <button (click)="next()" class="nav-btn next" aria-label="Next Slide">→</button>
    </div>
  </div>
</div>
