<div class="slider-moderne" (mouseenter)="stopAutoSlide()" (mouseleave)="startAutoSlide()">
    <div class="slides-container">
        <div class="slide" *ngFor="let slide of slides; let i = index" [class.active]="currentSlide === i"
            [class.prev]="i === (currentSlide - 1 + slides.length) % slides.length"
            [class.next]="i === (currentSlide + 1) % slides.length">
            <div class="image-wrapper">
                <img [appResponsiveImage]="slide.imageConfig" [fallbackSrc]="slide.fallbackSrc" class="slide-image"
                    alt="{{ slide.alt }}" />
                <div class="image-overlay"></div>
            </div>

            <div class="content-wrapper">
                <div class="glass-card">
                    <h2 class="slide-title">
                        {{ slide.title }} <span class="highlight">{{ slide.highlight }}</span>
                    </h2>
                    <p class="slide-description">{{ slide.description }}</p>

                    <div class="buttons-container" *ngIf="slide.buttons.length > 0">
                        <button *ngFor="let button of slide.buttons" class="modern-btn"
                            [class.primary]="button.color === 'primary'"
                            [class.secondary]="button.color === 'secondary'" (click)="navigateTo(button.link)">
                            {{ button.text }}
                            <span class="btn-arrow">→</span>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <button class="nav-btn prev" (click)="prevSlide()" aria-label="Previous Slide">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M15 18L9 12L15 6" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                stroke-linejoin="round" />
        </svg>
    </button>

    <button class="nav-btn next" (click)="nextSlide()" aria-label="Next Slide">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M9 18L15 12L9 6" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                stroke-linejoin="round" />
        </svg>
    </button>

    <div class="indicators">
        <button *ngFor="let slide of slides; let i = index" class="indicator-dot" [class.active]="currentSlide === i"
            (click)="showSlide(i)" [attr.aria-label]="'Go to slide ' + (i + 1)">
            <span class="progress-bar" *ngIf="currentSlide === i"></span>
        </button>
    </div>
</div>
