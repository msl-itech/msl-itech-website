<div class="banner-section2 position-relative">
  <img src="../../assets/img/webp/30.webp" alt="MSL Itech Banner" class="w-100">
  <div class="overlay-text d-flex align-items-center justify-content-center">
    <div class="text-center text-white px-3">
      <h2> Contactez-Nous </h2>
    </div>
  </div>
</div>

<div class="contact-page">
  <!-- Section Contact -->
  <div class="contact-container">
    <!-- Informations de contact -->
    <div class="contact-info">
      <h2 class="info-title">MSL-iTECH</h2>
      <div class="info-items">
        <div class="info-item">
          <i class="fas fa-map-marker-alt"></i>
          <p>951 Q.I. AL MASSAR N° 2, ROUTE DE SAFI, MAROC</p>
        </div>
        <div class="info-item">
          <i class="fas fa-phone-alt"></i>
          <p>+32 2 883 86 86</p>
        </div>
        <div class="info-item">
          <i class="fas fa-envelope"></i>
          <p>info&#64;msl-itech.com</p>
        </div>
      </div>
    </div>

    <!-- Formulaire -->
    <div class="contact-form-container">
      <h2 class="form-title">Contactez-nous</h2>
      <p class="form-subtitle">Pour tout ce qui concerne notre entreprise ou nos services. Nous ferons de notre mieux pour vous répondre dans les plus brefs délais.</p>
      
      <form class="modern-form">
        <div class="form-group">
          <input type="text" id="name" required class="form-control">
          <label for="name">Votre nom *</label>
        </div>

        <div class="form-group">
          <input type="tel" id="phone" required class="form-control">
          <label for="phone">Numéro de téléphone</label>
        </div>

        <div class="form-group">
          <input type="email" id="email" required class="form-control">
          <label for="email">Votre e-mail *</label>
        </div>

        <div class="form-group">
          <input type="text" id="company" required class="form-control">
          <label for="company">Votre société *</label>
        </div>

        <div class="form-group full-width">
          <input type="text" id="subject" required class="form-control">
          <label for="subject">Sujet *</label>
        </div>

        <div class="form-group full-width">
          <textarea id="message" required class="form-control" rows="4"></textarea>
          <label for="message">Votre question *</label>
        </div>

        <button type="submit" class="submit-btn">
          <span>Soumettre</span>
          <i class="fas fa-arrow-right"></i>
        </button>
      </form>
    </div>
  </div>
</div>
